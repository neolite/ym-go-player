<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Музыка</title>
  <style>
    :root {
      --bg:#f5f5f8; --surface:#ffffff; --surface2:#eeeef3;
      --fg:#16161d; --dim:#63636f; --faint:#a2a2b0;
      --accent:#7c5cf0; --accent-text:#6d4ae0; --on-accent:#ffffff;
      --grad:linear-gradient(135deg,#7c5cf0,#ec4899);
      --line:#16161d10; --line-strong:#16161d1f;
      --err-bg:#fdeeee; --err-fg:#b13c2e;
      --shadow-s:0 1px 2px #16161d0f, 0 4px 12px #16161d0a;
      --shadow-m:0 2px 6px #16161d14, 0 16px 40px #16161d17;
      --ease:cubic-bezier(.2,.7,.3,1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0d0d13; --surface:#17171f; --surface2:#1f1f2a;
        --fg:#f2f2f7; --dim:#9c9cab; --faint:#5d5d6e;
        --accent:#8b6ff5; --accent-text:#a78bfa; --on-accent:#ffffff;
        --line:#ffffff10; --line-strong:#ffffff20;
        --err-bg:#2a1618; --err-fg:#ff9e8f;
        --shadow-s:0 1px 2px #00000040, 0 4px 12px #00000030;
        --shadow-m:0 2px 8px #00000050, 0 16px 44px #00000055;
      }
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.55 -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      letter-spacing:-0.003em;
    }
    /* рассеянные цветные пятна на фоне — фирменный «SF-градиент»;
       в кислотной теме заменяется плёночным зерном (body.acid::before) */
    body::before {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(600px 420px at 85% -10%, #7c5cf01f, transparent 70%),
        radial-gradient(520px 380px at -10% 30%, #ec489914, transparent 70%);
    }
    button { font:inherit; color:inherit; cursor:pointer; }
    button, a, input { -webkit-tap-highlight-color:transparent; }
    ::selection { background:#7c5cf033; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
    .hidden { display:none !important; }

    /* --- каркас --- */
    #app { max-width:720px; margin:0 auto; padding:16px 20px 64px; }

    header {
      position:sticky; top:0; z-index:10;
      display:flex; align-items:center; gap:10px;
      padding:12px 0; margin-bottom:28px;
      background:color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter:blur(14px) saturate(1.5);
      -webkit-backdrop-filter:blur(14px) saturate(1.5);
      border-bottom:1px solid var(--line);
    }
    .sources {
      display:flex; gap:2px; padding:3px;
      background:var(--surface2); border-radius:12px;
    }
    .sources button {
      background:none; border:none; border-radius:9px;
      padding:7px 14px; font-size:14px; font-weight:550; color:var(--dim);
      transition:color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
    }
    .sources button:hover { color:var(--fg); }
    .sources button.active {
      color:var(--fg); background:var(--surface); box-shadow:var(--shadow-s);
    }
    #search {
      margin-left:auto; width:170px; padding:8px 14px;
      background:var(--surface2); border:1px solid transparent;
      border-radius:999px; color:var(--fg); font:inherit; font-size:14px;
      transition:border-color .2s var(--ease), background .2s var(--ease);
    }
    #search::placeholder { color:var(--faint); }
    #search:focus { border-color:var(--accent); background:var(--surface); outline:none; }

    #btnTheme {
      flex:none; width:34px; height:34px;
      display:inline-flex; align-items:center; justify-content:center;
      background:var(--surface2); border:none; border-radius:10px;
      color:var(--dim); transition:color .2s var(--ease), transform .2s var(--ease);
    }
    #btnTheme svg { width:15px; height:15px; fill:currentColor; }
    #btnTheme:hover { color:var(--fg); transform:rotate(15deg); }

    /* элементы экспериментальной темы lab — в базовой скрыты */
    #bgArt, #bigTime, li .qcover { display:none; }

    #errorBar {
      margin:-12px 0 20px; padding:11px 16px; border-radius:12px;
      background:var(--err-bg); color:var(--err-fg); font-size:14px; font-weight:500;
    }

    /* --- сейчас играет --- */
    #now { display:flex; gap:26px; align-items:flex-start; margin-bottom:34px; }
    #cover {
      width:208px; height:208px; border-radius:22px; flex:none;
      background:var(--surface2); object-fit:cover;
      box-shadow:var(--shadow-m);
      transition:transform .25s var(--ease);
    }
    #cover:hover { transform:scale(1.02); }
    #trackMeta { min-width:0; flex:1; display:flex; flex-direction:column; }
    #title {
      font-size:clamp(22px,3.4vw,30px); font-weight:700; line-height:1.15;
      letter-spacing:-0.022em; margin:6px 0 3px;
    }
    #artist { color:var(--dim); font-size:16px; margin-bottom:20px; }

    /* --- прогресс --- */
    #progressWrap { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
    .time { font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums; min-width:36px; }
    .time:last-child { text-align:right; }
    input[type=range] { -webkit-appearance:none; appearance:none; background:none; margin:0; }
    #progress { flex:1; height:22px; cursor:pointer; }
    #progress::-webkit-slider-runnable-track {
      height:5px; border-radius:3px;
      background:linear-gradient(90deg,#7c5cf0,#ec4899 var(--fill,0%),var(--line-strong) var(--fill,0%));
    }
    #progress::-webkit-slider-thumb {
      -webkit-appearance:none; width:15px; height:15px; margin-top:-5px;
      border-radius:50%; background:#fff; box-shadow:0 1px 4px #00000045;
      transition:transform .18s var(--ease);
    }
    #progress:hover::-webkit-slider-thumb { transform:scale(1.25); }
    #progress::-moz-range-track { height:5px; border-radius:3px; background:var(--line-strong); }
    #progress::-moz-range-progress { height:5px; border-radius:3px; background:linear-gradient(90deg,#7c5cf0,#ec4899); }
    #progress::-moz-range-thumb { width:15px; height:15px; border:none; border-radius:50%; background:#fff; box-shadow:0 1px 4px #00000045; }

    /* --- транспорт и громкость --- */
    #controls { display:flex; align-items:center; gap:12px; }
    .tbtn {
      width:46px; height:46px; border-radius:50%;
      border:none; background:var(--surface2);
      display:inline-flex; align-items:center; justify-content:center;
      color:var(--fg); transition:background .2s var(--ease), transform .2s var(--ease);
    }
    .tbtn:hover { background:var(--line-strong); transform:translateY(-1px); }
    .tbtn svg { width:19px; height:19px; fill:currentColor; }
    #btnPlay {
      width:60px; height:60px;
      background:var(--grad); color:var(--on-accent);
      box-shadow:0 6px 18px #7c5cf052;
      transition:transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
    }
    #btnPlay:hover { transform:scale(1.06); filter:brightness(1.06); box-shadow:0 8px 24px #7c5cf066; }
    #btnPlay svg { width:25px; height:25px; }
    #btnPlay .icon-pause { display:none; }
    #btnPlay.playing .icon-pause { display:block; }
    #btnPlay.playing .icon-play { display:none; }
    #btnLike:hover { color:#ec4899; background:var(--line-strong); transform:translateY(-1px); }
    #btnDislike:hover { color:var(--accent-text); background:var(--line-strong); transform:translateY(-1px); }
    #volumeWrap { display:flex; align-items:center; gap:8px; margin-left:auto; color:var(--faint); }
    #volumeWrap svg { width:17px; height:17px; fill:currentColor; }
    #volume { width:104px; height:20px; cursor:pointer; }
    #volume::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:var(--line-strong); }
    #volume::-webkit-slider-thumb {
      -webkit-appearance:none; width:12px; height:12px; margin-top:-4px;
      border-radius:50%; background:var(--dim); transition:background .18s var(--ease);
    }
    #volume:hover::-webkit-slider-thumb { background:var(--fg); }
    #volume::-moz-range-track { height:4px; border-radius:2px; background:var(--line-strong); }
    #volume::-moz-range-thumb { width:12px; height:12px; border:none; border-radius:50%; background:var(--dim); }

    /* --- очередь и плейлисты --- */
    ul { list-style:none; padding:0; margin:0; }
    li {
      display:flex; align-items:baseline; gap:12px;
      padding:10px 12px; border-radius:12px; cursor:pointer;
      transition:background .18s var(--ease), transform .18s var(--ease);
    }
    li:hover { background:var(--surface); box-shadow:var(--shadow-s); }
    li .idx { width:22px; flex:none; text-align:right; font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
    li .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    li .name .t { font-weight:550; }
    li .name .a { color:var(--dim); }
    li .dur { margin-left:auto; flex:none; font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
    li.current { background:var(--surface); box-shadow:var(--shadow-s); }
    li.current .idx { color:var(--accent-text); font-weight:700; }
    li.current .name .t { color:var(--accent-text); }

    /* --- авторизация --- */
    #auth {
      max-width:420px; margin:12vh auto 0; padding:36px;
      background:var(--surface); border:1px solid var(--line);
      border-radius:22px; box-shadow:var(--shadow-m);
    }
    #auth h2 { margin:0 0 8px; font-size:22px; font-weight:700; letter-spacing:-0.02em; }
    #auth p { margin:0 0 18px; color:var(--dim); font-size:14.5px; }
    #auth a { color:var(--accent-text); }
    #auth code { font-size:13px; background:var(--surface2); padding:1px 6px; border-radius:6px; }
    #tokenInput {
      width:100%; padding:11px 14px; margin-bottom:14px;
      background:var(--surface2); border:1px solid transparent;
      border-radius:12px; color:var(--fg); font:inherit; font-size:14px;
      transition:border-color .2s var(--ease), background .2s var(--ease);
    }
    #tokenInput:focus { border-color:var(--accent); background:var(--surface); outline:none; }
    #tokenSave {
      padding:10px 24px; border:none; border-radius:999px;
      background:var(--grad); color:var(--on-accent); font-weight:600;
      box-shadow:0 4px 14px #7c5cf045;
      transition:transform .2s var(--ease), filter .2s var(--ease);
    }
    #tokenSave:hover { transform:translateY(-1px); filter:brightness(1.06); }
    #authMsg { margin-left:10px; font-size:14px; color:var(--err-fg); }

    /* --- кислотная тема (переключатель #btnTheme) --- */
    body.acid {
      --bg:#060606; --surface:#101010; --surface2:#181818;
      --fg:#f4fffd; --dim:#9aa39e; --faint:#5c665f;
      --accent:#c8ff00; --accent-text:#c8ff00; --on-accent:#0a0a00;
      --line:#ffffff1f; --line-strong:#ffffff3d;
      --err-bg:#2b0a1e; --err-fg:#ff7ad9;
      --acid2:#ff2ed1; --acid3:#00e5ff;
    }
    /* зернистость поверх всего — плёночный шум, без интерактива */
    body.acid::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
      opacity:.06;
      background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/></filter><rect width="140" height="140" filter="url(%23n)" opacity="0.6"/></svg>');
    }
    body.acid header { border-bottom:3px solid var(--accent); }
    body.acid .sources { background:none; padding:0; border-radius:0; gap:8px; }
    body.acid #btnTheme { background:none; }
    body.acid .sources button {
      text-transform:uppercase; font-weight:800; font-size:13px;
      letter-spacing:.08em; border:2px solid transparent; border-radius:0;
    }
    body.acid .sources button:hover { color:#060606; background:var(--accent); }
    body.acid .sources button.active {
      color:var(--accent); background:var(--bg);
      border-color:var(--accent); box-shadow:none; border-radius:0;
    }
    body.acid #search {
      border:2px solid var(--line-strong); border-radius:0;
      text-transform:uppercase; font-weight:700;
    }
    body.acid #search:focus { border-color:var(--acid3); }
    body.acid #cover {
      border:3px solid var(--accent); border-radius:0; transform:rotate(-2deg);
      filter:saturate(1.5) contrast(1.15); box-shadow:10px 10px 0 var(--acid2);
    }
    body.acid #title {
      font-size:clamp(32px,5.5vw,50px); font-weight:900; text-transform:uppercase;
      letter-spacing:-.02em; line-height:.95; color:var(--accent);
    }
    body.acid #artist {
      text-transform:uppercase; font-weight:700;
      letter-spacing:.12em; color:var(--acid3);
    }
    body.acid .time { color:var(--faint); font-weight:700; }
    body.acid #progress { height:26px; }
    body.acid #progress::-webkit-slider-runnable-track {
      height:8px; border-radius:0;
      background:linear-gradient(to right, var(--acid2) var(--fill,0%), #ffffff2e var(--fill,0%));
    }
    body.acid #progress::-webkit-slider-thumb {
      width:16px; height:22px; margin-top:-7px; border-radius:0;
      background:var(--accent); box-shadow:3px 3px 0 var(--acid2);
    }
    body.acid #progress::-moz-range-track { height:8px; border-radius:0; background:#ffffff2e; }
    body.acid #progress::-moz-range-progress { height:8px; border-radius:0; background:var(--acid2); }
    body.acid #progress::-moz-range-thumb { width:16px; height:22px; border-radius:0; border:none; background:var(--accent); }
    body.acid .tbtn { border:2px solid var(--fg); border-radius:0; }
    body.acid .tbtn:hover {
      background:var(--acid3); border-color:var(--acid3); color:#060606;
      transform:translate(-2px,-2px); box-shadow:4px 4px 0 var(--acid2);
    }
    body.acid #btnPlay {
      background:var(--accent); border-radius:0; box-shadow:6px 6px 0 var(--acid2);
    }
    body.acid #btnPlay:hover {
      transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--acid2); filter:none;
    }
    body.acid li { border-radius:0; border:2px solid transparent; }
    body.acid li .idx { font-size:15px; font-weight:900; color:var(--acid2); }
    body.acid li .name { text-transform:uppercase; font-weight:700; letter-spacing:.02em; }
    body.acid li:hover { background:var(--accent); }
    body.acid li:hover .t, body.acid li:hover .a,
    body.acid li:hover .idx, body.acid li:hover .dur { color:#060606; }
    body.acid li.current { background:var(--surface); border-color:var(--accent); }
    body.acid li.current .t { color:var(--accent); }
    body.acid li.current .idx { color:var(--acid2); }
    body.acid #errorBar {
      border-radius:0; border:2px solid var(--err-fg);
      font-weight:700; text-transform:uppercase;
    }
    body.acid #auth {
      border:3px solid var(--accent); border-radius:0;
      box-shadow:10px 10px 0 var(--acid2);
    }
    body.acid #tokenInput { border-radius:0; border-width:2px; }
    body.acid #tokenSave { border-radius:0; text-transform:uppercase; font-weight:900; box-shadow:4px 4px 0 var(--acid2); }
    body.acid #btnTheme { border:2px solid var(--acid3); border-radius:0; color:var(--acid3); }

    /* --- лаборатория: иммерсивный плеер (третья тема, цикл #btnTheme) ---
       Всегда тёмная: фон — размытая обложка, текст принудительно светлый. */
    body.lab {
      background:#0d0d13;
      --fg:#f5f5fa; --dim:#ffffff99; --faint:#ffffff66;
      --accent:#8b6ff5; --accent-text:#a78bfa;
      --line:#ffffff1a; --line-strong:#ffffff30;
      --surface:#ffffff10; --surface2:#ffffff14;
    }
    body.lab #bgArt {
      display:block; position:fixed; inset:-8%; z-index:-1;
      background-size:cover; background-position:center;
      filter:blur(70px) saturate(1.7) brightness(.45);
      animation:bgDrift 36s ease-in-out infinite alternate;
    }
    @keyframes bgDrift {
      from { transform:translate(-2%,-1%) scale(1.08); }
      to { transform:translate(2%,1%) scale(1.15); }
    }
    body.lab #app { max-width:900px; padding-top:48px; }
    body.lab header { background:none; border-bottom:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
    body.lab .sources { background:#ffffff12; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    body.lab .sources button { color:#ffffff99; }
    body.lab .sources button.active { color:#fff; }
    body.lab #search { background:#ffffff12; color:#fff; }
    body.lab #search::placeholder { color:#ffffff77; }
    body.lab #btnTheme { background:#ffffff12; color:#ffffff99; }
    body.lab #btnTheme:hover { color:#fff; }

    body.lab #now { align-items:center; gap:44px; margin:2vh 0 4vh; }
    body.lab #cover {
      width:min(340px,38vw); height:auto; aspect-ratio:1; border-radius:28px;
      box-shadow:0 30px 80px #000000a6;
      -webkit-box-reflect:below 12px linear-gradient(transparent 55%, #ffffff1f);
    }
    body.lab #cover:hover { transform:scale(1.03) rotate(-.5deg); }
    body.lab #title {
      font-size:clamp(36px,5.2vw,60px); font-weight:800;
      letter-spacing:-.03em; line-height:1.02; color:#fff;
      text-shadow:0 2px 30px #00000066;
    }
    body.lab #artist { font-size:19px; color:#ffffffb3; margin-bottom:8px; }
    body.lab #bigTime {
      display:block; font-size:15px; color:#ffffff80;
      font-variant-numeric:tabular-nums; margin-bottom:20px;
    }

    /* прогресс — толстая линия в середине блока; маленькие подписи времени
       скрыты, их роль играет крупный #bigTime */
    body.lab #progressWrap { margin-bottom:26px; }
    body.lab #progressWrap .time { display:none; }
    body.lab #progress { height:26px; }
    body.lab #progress::-webkit-slider-runnable-track {
      height:8px; border-radius:4px;
      background:linear-gradient(90deg,#7c5cf0,#ec4899 var(--fill,0%),#ffffff1f var(--fill,0%));
    }
    body.lab #progress::-webkit-slider-thumb { width:18px; height:18px; margin-top:-5px; }
    body.lab #progress::-moz-range-track { height:8px; border-radius:4px; background:#ffffff1f; }
    body.lab #progress::-moz-range-progress { height:8px; border-radius:4px; }

    /* транспорт: предыдущий демонстративно унижен, следующий крупнее,
       play — гигант */
    body.lab #controls { gap:16px; }
    body.lab .tbtn { background:#ffffff14; color:#fff; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    body.lab .tbtn:hover { background:#ffffff2b; transform:translateY(-2px); }
    body.lab #btnPrev { width:52px; height:52px; opacity:.7; }
    body.lab #btnNext { width:64px; height:64px; }
    body.lab #btnPlay { width:86px; height:86px; box-shadow:0 12px 44px #7c5cf08c; }
    body.lab #btnPlay svg { width:34px; height:34px; }
    body.lab #volumeWrap { color:#ffffff99; }
    body.lab #volume::-webkit-slider-runnable-track { background:#ffffff2e; }
    body.lab #volume::-moz-range-track { background:#ffffff2e; }

    /* очередь — горизонтальная карусель обложек */
    body.lab ul#list {
      display:flex; gap:18px; overflow-x:auto; padding:8px 2px 20px;
      scroll-snap-type:x mandatory;
    }
    body.lab ul#list li {
      flex:0 0 148px; scroll-snap-align:start;
      flex-direction:column; align-items:stretch; gap:8px;
      padding:0; background:none; box-shadow:none; border-radius:16px;
    }
    body.lab ul#list li:hover { background:none; box-shadow:none; transform:translateY(-4px); }
    body.lab li .qcover {
      display:block; width:148px; height:148px; object-fit:cover;
      border-radius:16px; box-shadow:0 8px 24px #00000080;
      transition:outline-color .18s var(--ease);
    }
    body.lab ul#list li .idx, body.lab ul#list li .dur { display:none; }
    body.lab ul#list li .name { font-size:13px; white-space:normal; line-height:1.3; }
    body.lab ul#list li .name .t { color:#fff; font-weight:600; }
    body.lab ul#list li .name .a { display:block; font-size:12px; color:#ffffff88; }
    body.lab ul#list li.current { background:none; box-shadow:none; }
    body.lab ul#list li.current .qcover { outline:2px solid var(--accent); outline-offset:3px; }
    body.lab ul#list li.current .name .t { color:var(--accent-text); }

    @media (max-width:560px) {
      body.lab #now { flex-direction:column; gap:20px; margin-top:3vh; }
      body.lab #cover { width:min(72vw,300px); }
      body.lab #title { font-size:30px; }
    }

    /* --- blok: пост-советский брутализм (Гоша / Yeezy / ASSC) ---
       Всегда светлая: бежевый холст, чёрные блоки, один красный акцент,
       рубленый condensed, ноль скруглений, обложки в ч/б. */
    body.blok {
      background:#e6e1d6;
      --bg:#e6e1d6; --surface:#efece4; --surface2:#dbd6c7;
      --fg:#111111; --dim:#55524a; --faint:#8d887c;
      --accent:#d40000; --accent-text:#d40000; --on-accent:#ffffff;
      --line:#1111111f; --line-strong:#11111138;
      --err-bg:#d4000014; --err-fg:#8a0000;
    }
    body.blok #app { max-width:760px; }
    body.blok header { border-bottom:3px solid #111; padding-bottom:14px; background:none; backdrop-filter:none; -webkit-backdrop-filter:none; }
    body.blok .sources { background:none; padding:0; gap:10px; }
    body.blok .sources button {
      text-transform:uppercase; font-weight:800; font-size:13px;
      letter-spacing:.1em; color:#111; border:2px solid transparent;
      border-radius:0; padding:7px 10px;
    }
    body.blok .sources button:hover { border-color:#111; }
    body.blok .sources button.active { background:#111; color:#e6e1d6; box-shadow:none; border-radius:0; }
    body.blok #search {
      border:2px solid #111; border-radius:0; background:transparent;
      text-transform:uppercase; font-weight:700; font-size:12px; letter-spacing:.08em;
    }
    body.blok #search:focus { border-color:var(--accent); background:transparent; }
    body.blok #btnTheme { background:none; border:2px solid #111; border-radius:0; color:#111; }
    body.blok #btnTheme:hover { color:var(--accent); border-color:var(--accent); transform:none; }

    body.blok #now { flex-wrap:wrap; gap:22px; margin-bottom:26px; }
    body.blok #now::before {
      content:"СЕЙЧАС ИГРАЕТ — NOW PLAYING"; flex-basis:100%;
      font:700 11px ui-monospace, monospace; letter-spacing:.22em; color:var(--dim);
    }
    body.blok #cover {
      border-radius:0; border:3px solid #111;
      filter:grayscale(1) contrast(1.15);
      box-shadow:none; transition:filter .25s var(--ease);
    }
    body.blok #cover:hover { filter:none; transform:none; }
    body.blok #title {
      font-family:-apple-system, "Helvetica Neue", system-ui, sans-serif;
      font-stretch:condensed;
      font-size:clamp(32px,5vw,52px); font-weight:900; text-transform:uppercase;
      letter-spacing:-.01em; line-height:.92; transform:rotate(-1deg);
      transform-origin:left bottom;
    }
    body.blok #artist {
      text-transform:uppercase; font-weight:700; letter-spacing:.14em;
      font-size:13px; color:#111; margin-top:8px;
    }
    body.blok #progressWrap { margin-bottom:22px; }
    body.blok .time { font-family:ui-monospace, monospace; font-weight:700; color:#111; }
    body.blok #progress { height:26px; }
    body.blok #progress::-webkit-slider-runnable-track {
      height:10px; border-radius:0;
      background:linear-gradient(to right, var(--accent) var(--fill,0%), #11111126 var(--fill,0%));
    }
    body.blok #progress::-webkit-slider-thumb {
      width:14px; height:22px; margin-top:-6px; border-radius:0; background:#111; box-shadow:none;
    }
    body.blok #progress::-moz-range-track { height:10px; border-radius:0; background:#11111126; }
    body.blok #progress::-moz-range-progress { height:10px; border-radius:0; background:var(--accent); }
    body.blok #progress::-moz-range-thumb { width:14px; height:22px; border-radius:0; border:none; background:#111; }

    body.blok .tbtn { border-radius:0; background:#111; color:#e6e1d6; }
    body.blok .tbtn:hover { background:var(--accent); transform:none; }
    body.blok #btnPlay {
      border-radius:0; background:var(--accent); box-shadow:none;
      width:64px; height:64px;
    }
    body.blok #btnPlay:hover { background:#111; transform:none; filter:none; box-shadow:none; }
    body.blok #volumeWrap { color:#111; }
    body.blok #volume::-webkit-slider-runnable-track { background:#111; }
    body.blok #volume::-webkit-slider-thumb { border-radius:0; background:#111; }
    body.blok #volume::-moz-range-track { background:#111; }
    body.blok #volume::-moz-range-thumb { border-radius:0; background:#111; }

    body.blok ul#list::before {
      content:"ОЧЕРЕДЬ — QUEUE"; display:block; margin-bottom:8px;
      font:700 11px ui-monospace, monospace; letter-spacing:.22em; color:var(--dim);
    }
    body.blok li {
      border-radius:0; border-bottom:2px solid #111;
      padding:12px 6px; box-shadow:none;
    }
    body.blok li:hover { background:var(--surface2); box-shadow:none; }
    body.blok li .idx { font:900 15px ui-monospace, monospace; color:#111; }
    body.blok li .name .t { text-transform:uppercase; font-weight:800; letter-spacing:.02em; }
    body.blok li .name .a { text-transform:uppercase; font-size:12px; letter-spacing:.06em; }
    body.blok li .dur { font:700 13px ui-monospace, monospace; color:#111; }
    body.blok li.current { background:#111; box-shadow:none; }
    body.blok li.current .name .t, body.blok li.current .idx { color:#e6e1d6; }
    body.blok li.current .name .a { color:#e6e1d699; }
    body.blok li.current .dur { color:var(--accent); }

    body.blok #errorBar {
      border-radius:0; border:2px solid var(--err-fg); background:transparent;
      font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    }
    body.blok #auth { border:3px solid #111; border-radius:0; box-shadow:none; background:var(--surface); }
    body.blok #auth h2 { text-transform:uppercase; letter-spacing:0; }
    body.blok #tokenInput { border:2px solid #111; border-radius:0; background:transparent; }
    body.blok #tokenSave { border-radius:0; background:var(--accent); text-transform:uppercase; font-weight:900; letter-spacing:.08em; box-shadow:none; }
    body.blok #tokenSave:hover { background:#111; transform:none; filter:none; }

    /* --- мобильный --- */
    @media (max-width:560px) {
      #app { padding:14px 14px 48px; }
      header { flex-wrap:wrap; }
      #search { width:100%; margin:8px 0 0; }
      #now { gap:16px; }
      #cover { width:104px; height:104px; border-radius:10px; }
      #title { font-size:19px; }
      #artist { font-size:14px; margin-bottom:12px; }
      #controls { flex-wrap:wrap; }
      #volumeWrap { margin-left:0; width:100%; }
      #volume { flex:1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition:none !important; animation:none !important; }
    }
  </style>
</head>
<body>
  <div id="bgArt" aria-hidden="true"></div>
  <div id="auth" class="hidden">
    <h2>Нужен токен</h2>
    <p>Откройте <a id="authLink" target="_blank" rel="noopener">страницу входа Яндекса</a>,
       войдите и скопируйте значение <code>access_token</code> из адресной строки.</p>
    <input id="tokenInput" placeholder="Вставьте токен сюда" autocomplete="off" aria-label="Токен">
    <p><button id="tokenSave">Сохранить</button> <span id="authMsg" role="alert"></span></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <nav class="sources" aria-label="Источники">
        <button id="btnWave">Моя волна</button>
        <button id="btnLikes">Мне нравится</button>
        <button id="btnLists">Плейлисты</button>
      </nav>
      <input id="search" placeholder="Поиск" aria-label="Поиск">
      <button id="btnTheme" title="Переключить тему" aria-label="Переключить тему">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.3 6.7L21 11l-6.7 2.3L12 20l-2.3-6.7L3 11l6.7-2.3z"/></svg>
      </button>
    </header>
    <div id="errorBar" class="hidden" role="alert"></div>
    <main>
      <section id="now" aria-label="Сейчас играет">
        <img id="cover" alt="Обложка трека">
        <div id="trackMeta">
          <div id="title">—</div>
          <div id="artist"></div>
          <div id="bigTime">0:00</div>
          <div id="progressWrap">
            <span class="time" id="timeCur">0:00</span>
            <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Позиция">
            <span class="time" id="timeTotal">0:00</span>
          </div>
          <div id="controls">
            <button class="tbtn" id="btnDislike" aria-label="Не нравится">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path transform="translate(0 24) scale(1 -1)" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            </button>
            <button class="tbtn" id="btnPrev" aria-label="Предыдущий трек">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
            </button>
            <button class="tbtn" id="btnPlay" aria-label="Играть или пауза">
              <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h3.6v15H6.5zm7.4 0h3.6v15h-3.6z"/></svg>
            </button>
            <button class="tbtn" id="btnNext" aria-label="Следующий трек">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
            </button>
            <button class="tbtn" id="btnLike" aria-label="Нравится">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
            <div id="volumeWrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4.5v-15L7 9H3zm13.6 3a3.6 3.6 0 0 0-2.1-3.3v6.5a3.6 3.6 0 0 0 2.1-3.2zm-2.1-8v2.1a6 6 0 0 1 0 11.8v2.1a8 8 0 0 0 0-16z"/></svg>
              <input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Громкость">
            </div>
          </div>
        </div>
      </section>
      <ul id="list"></ul>
      <ul id="lists" class="hidden"></ul>
    </main>
  </div>

  <audio id="audio"></audio>
  <script src="./app.js"></script>
</body>
</html>
